<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sources</title><script src="nav.js"></script><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 25% 0%,#211a3c 0%,#090d18 50%);color:#eef2ff;min-height:100vh;padding:28px}.shell{max-width:1200px;margin:auto;background:#101827;border:1px solid #29354b;border-radius:24px;padding:28px;box-shadow:0 25px 70px #0006}.pill{display:inline-block;background:#352350;color:#cbb2ff;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;letter-spacing:1px}h1{font-size:clamp(26px,4vw,40px);margin:16px 0 18px;letter-spacing:-1px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.src{--c:#38b6f5;display:flex;flex-direction:column;background:#141f30;border:1px solid #2a3a52;border-top:4px solid var(--c);border-radius:16px;padding:20px 22px;text-decoration:none;color:inherit;opacity:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards;transition:transform .25s,box-shadow .25s,border-color .25s,background .25s}.src:hover,.src:focus-visible{transform:translateY(-4px);border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#141f30);box-shadow:0 14px 34px #0006;outline:none}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.kind{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--c)}.n{font-size:28px;font-weight:850;color:var(--c);opacity:.9;letter-spacing:-1px}.src h2{margin:0 0 6px;font-size:21px;letter-spacing:-.3px}.cite{color:#bdc9da;font-size:14.5px;line-height:1.5;margin:0 0 10px}.cite em{color:#eef2ff}.desc{color:#9bacc5;font-size:14.5px;line-height:1.55;margin:0 0 14px}.url{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#8496af;font-size:12.5px;word-break:break-all}.url b{flex:none;color:var(--c);font-size:13px}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.src{animation:none;opacity:1}}@media(max-width:900px){.grid{grid-template-columns:1fr}body{padding:10px}.shell{padding:16px}}
@media(min-width:1000px) and (min-height:640px){html body.fit{overflow:hidden;padding-top:58px!important;padding-bottom:72px!important}html body.fit .shell{height:calc(100vh - 132px);display:flex;flex-direction:column;padding:18px 24px;max-width:1340px}.fit .top{display:flex;align-items:center;gap:12px}.fit h1{margin:0;font-size:28px}.fit .grid{flex:1;min-height:0;margin-top:14px;grid-template-rows:1fr 1fr}.fit .src{padding:clamp(14px,2.4vh,26px) 24px;min-height:0;overflow:hidden}.fit .src h2{font-size:clamp(18px,2.9vh,26px)}.fit .cite,.fit .desc{font-size:clamp(13.5px,2vh,17px)}.fit .n{font-size:clamp(26px,4.4vh,40px)}}
</style></head><body class="fit"><main class="shell"><div class="top"><span class="pill">SOURCES</span><h1>Sources / References</h1></div><div class="grid" id="grid"></div></main><script>
const kinds={doc:['HASHICORP DOCUMENTATION','#38b6f5'],paper:['RESEARCH PAPER','#8b7cf6']};
const items=[
['doc','Vault Integrated Storage Internals','HashiCorp. <em>Vault Integrated Raft Storage.</em>','Explains leader election, log replication, quorum, and how Vault uses Raft to maintain consistent storage.','https://docs.hashicorp.com/vault/docs/internals/integrated-storage'],
['doc','Vault Raft Storage Documentation','HashiCorp. <em>Vault Integrated Storage Configuration.</em>','Explains how Raft storage is configured and how Vault replicates data across cluster nodes.','https://developer.hashicorp.com/vault/docs/configuration/storage/raft'],
['paper','Original Raft Research Paper (PDF)','Ongaro, D., &amp; Ousterhout, J. (2014). <em>In Search of an Understandable Consensus Algorithm.</em> USENIX Annual Technical Conference (ATC).','The foundational research paper explaining Raft\'s leader election, terms, log replication, commitment rules, and fault tolerance.','https://raft.github.io/raft.pdf'],
['doc','Vault Autopilot Documentation','HashiCorp. <em>Vault Integrated Storage Autopilot.</em>','Explains cluster health monitoring, server stabilization, and recovery-related management.','https://docs.hashicorp.com/vault/docs/concepts/integrated-storage/autopilot']];
document.getElementById('grid').innerHTML=items.map((t,i)=>`<a class="src" href="${t[4]}" target="_blank" rel="noopener noreferrer" style="--c:${kinds[t[0]][1]};animation-delay:${.1+i*.12}s"><div class="head"><span class="kind">${kinds[t[0]][0]}</span><span class="n">${i+1}</span></div><h2>${t[1]}</h2><p class="cite">${t[2]}</p><p class="desc">${t[3]}</p><div class="url"><span>${t[4].replace('https://','')}</span><b>Open ↗</b></div></a>`).join('');
</script></body></html>
