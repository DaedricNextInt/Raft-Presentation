<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raft — Consensus in Motion</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 25% 0%,#211a3c 0%,#090d18 50%);color:#eef2ff;min-height:100vh;padding:28px}.shell{max-width:1200px;margin:auto;background:#101827;border:1px solid #29354b;border-radius:24px;padding:28px;box-shadow:0 25px 70px #0006}.pill{display:inline-block;background:#352350;color:#cbb2ff;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;letter-spacing:1px}h1{font-size:clamp(26px,4vw,40px);margin:16px 0 6px;letter-spacing:-1px}#title{font-size:20px;color:#c4a6ff;font-weight:750;margin:10px 0 5px}#desc{color:#9bacc5;margin:0 0 22px;min-height:25px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#141f30;border:1px solid #2a3a52;border-radius:18px;padding:17px;min-width:0}.panel h2{font-size:12px;letter-spacing:1.6px;color:#8fa1ba;margin:0 0 10px}svg{width:100%;height:auto;display:block}.node{transition:fill .35s,stroke .35s}.node circle.outer{fill:#22324b;stroke:#7187b0;stroke-width:3}.node circle.inner{fill:#7187b0}.node.candidate circle.outer{stroke:#f0aa56}.node.candidate circle.inner{fill:#f0aa56}.node.leader circle.outer{stroke:#20c8ad}.node.leader circle.inner{fill:#20c8ad}.node .timer-track{fill:none;stroke:#1a2638;stroke-width:5}.node .timer{fill:none;stroke:#a78bfa;stroke-width:5;stroke-linecap:round}.node .timer.low{stroke:#ff6b81}.node text{font-weight:800;text-anchor:middle;fill:#0c1624}.edge{stroke:#2a3c56;stroke-width:2}.packet{fill:#ad90ff;filter:drop-shadow(0 0 6px #a78bfa)}.log{fill:#1b2a3f;stroke:#41516a;stroke-width:1.5}.log.active{fill:#124c4b;stroke:#20c8ad}.meta{display:flex;gap:20px;flex-wrap:wrap;margin-top:20px;color:#bdc9da;font-size:13px;font-weight:750}.meta strong{color:#22d3b6}button{border:1px solid #41516a;background:#1a293e;color:#eef2ff;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700}button:hover{background:#2b3b55}button.primary{background:#7547d5;border-color:#7547d5}button.primary:hover{background:#8d60ee}button:disabled{opacity:.35;cursor:default}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}.progress{height:7px;background:#29364b;border-radius:8px;overflow:hidden;margin-top:20px}.progress div{height:100%;background:#a78bfa;transition:width .3s}select{background:#1a293e;border:1px solid #41516a;color:white;border-radius:9px;padding:10px}.note{color:#8496af;font-size:12px;margin-top:15px;line-height:1.5}@media(max-width:720px){body{padding:10px}.shell{padding:16px}.layout{grid-template-columns:1fr}}
</style></head><body><main class="shell"><span class="pill">RAFT / LIVE SIMULATION</span><h1>Consensus in Motion</h1><div id="title"></div><p id="desc"></p><div class="layout"><section class="panel"><h2>CLUSTER TOPOLOGY</h2><svg viewBox="0 0 500 385" aria-label="Five Raft servers"><g id="edges"></g><g id="packets"></g><g id="nodes"></g></svg></section><section class="panel"><h2>REPLICATED LOG</h2><svg viewBox="0 0 500 385" id="logs" aria-label="Replicated server logs"></svg></section></div><div class="meta"><span id="term"></span><span id="votes"></span><span>QUORUM <strong>3 / 5</strong></span><span id="state"></span><span>RING = ELECTION TIMEOUT LEFT</span></div><div class="controls"><button id="prev">← Previous</button><button id="next" class="primary">Next →</button><button id="play">▶ Play</button><button id="reset">↺ Reset</button><label>Speed <select id="speed"><option value="2400">Slow</option><option value="1500" selected>Normal</option><option value="750">Fast</option></select></label></div><div class="progress"><div id="bar"></div></div><div class="note">Educational visualization: leader election, majority voting, AppendEntries, and log replication are simplified. Real Raft also checks log freshness and term-specific commit rules.</div></main><script>
const steps=[
['Cluster initialized','All five servers begin as followers, each with its own randomized election timeout (150–300 ms).',0,0,[],[],null,[170,110,140,55,190]],
['Election timeout','S4 has the shortest timeout (155 ms). It expires first with no heartbeat, so S4 becomes a candidate.',1,1,[],[],3,[115,55,85,0,135]],
['RequestVote RPCs','S4 requests votes from the other voting nodes.',1,1,[[3,0],[3,1],[3,2],[3,4]],[],3,[105,45,75,155,125]],
['Majority reached','S3 and S5 grant votes and reset their timers. S4 has three of five votes.',1,3,[[2,3],[4,3]],[],3,[95,35,240,145,290]],
['Leader elected','S4 becomes leader for term 1 and can coordinate replication. Leaders have no election timeout.',1,3,[],[],3,[85,25,230,null,280]],
['AppendEntries RPCs','Leader S4 sends a new log entry to followers. Each AppendEntries resets the follower\'s election timer.',1,3,[[3,0],[3,1],[3,2],[3,4]],[3],3,[270,210,240,null,290]],
['Followers acknowledge','Followers append the replicated entry to their logs.',1,3,[[0,3],[1,3],[2,3],[4,3]],[0,1,2,3,4],3,[260,200,230,null,280]],
['Entry committed','The entry is committed after satisfying majority and Raft commit rules.',1,3,[],[0,1,2,3,4],3,[250,190,220,null,270]]
];const xy=[[250,63],[416,175],[350,337],[150,337],[84,175]],timeouts=[270,210,240,155,290],ringC=2*Math.PI*42;let index=0,timer=null,raf=null,phase=0;const $=id=>document.getElementById(id);const svg=(s)=>s;
function draw(){let s=steps[index];$('title').textContent=(index+1)+' / '+steps.length+' — '+s[0];$('desc').textContent=s[1];$('term').textContent='TERM '+s[2];$('votes').textContent='S4 VOTES '+s[3]+'/5';$('state').textContent=index>=4?'● LEADER ACTIVE':'● ELECTION';$('bar').style.width=((index+1)/steps.length*100)+'%';$('prev').disabled=index===0;$('next').disabled=index===steps.length-1;
$('edges').innerHTML=xy.flatMap((a,i)=>xy.slice(i+1).map(b=>`<line class="edge" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`)).join('');$('nodes').innerHTML=xy.map(([x,y],i)=>{let role=i===3&&index>=4?'leader':i===3&&index>=1?'candidate':'follower';let left=s[7][i],f=left===null?0:left/timeouts[i],ring=left===null?'':`<circle class="timer-track" r="42"/><circle class="timer${f<.25?' low':''}" r="42" transform="rotate(-90)" stroke-dasharray="${ringC*f} ${ringC}"/>`;return `<g class="node ${role}" transform="translate(${x},${y})"><circle class="outer" r="47"/>${ring}<circle class="inner" r="35"/><text y="-8" font-size="20">S${i+1}</text><text y="7" font-size="8">${role.toUpperCase()}</text><text y="21" font-size="8">${left===null?'NO TIMEOUT':left+'/'+timeouts[i]+'ms'}</text></g>`}).join('');$('logs').innerHTML=Array.from({length:5},(_,i)=>`<text x="7" y="${49+i*67}" fill="#dbe5f6" font-size="18" font-weight="700">S${i+1}</text>`+Array.from({length:8},(_,j)=>`<rect class="log ${s[5].includes(i)&&j===0?'active':''}" x="${62+j*54}" y="${23+i*67}" width="47" height="41" rx="5"/>${s[5].includes(i)&&j===0?`<text x="${85+j*54}" y="${50+i*67}" text-anchor="middle" font-size="16" fill="#9cfff0">1</text>`:''}`).join('')).join('');drawPackets();}
function drawPackets(){let a=steps[index][4];$('packets').innerHTML=a.map(([from,to])=>{let p=xy[from],q=xy[to],t=.08+.84*phase;return `<circle class="packet" cx="${p[0]+(q[0]-p[0])*t}" cy="${p[1]+(q[1]-p[1])*t}" r="8"/>`}).join('')}
function animate(time){phase=(time%1200)/1200;drawPackets();raf=requestAnimationFrame(animate)}function stop(){clearInterval(timer);timer=null;$('play').textContent='▶ Play'}function step(n){index=Math.max(0,Math.min(steps.length-1,n));draw()}
$('prev').onclick=()=>{stop();step(index-1)};$('next').onclick=()=>{stop();step(index+1)};$('reset').onclick=()=>{stop();step(0)};$('play').onclick=()=>{if(timer){stop();return}if(index===steps.length-1)step(0);$('play').textContent='Ⅱ Pause';timer=setInterval(()=>{if(index===steps.length-1){stop();return}step(index+1)},Number($('speed').value))};$('speed').onchange=()=>{if(timer){stop();$('play').click()}};draw();raf=requestAnimationFrame(animate);
</script></body></html>
