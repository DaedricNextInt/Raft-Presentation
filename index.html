<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Raft &amp; How Vault uses it</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: radial-gradient(ellipse at 25% 0%, #211a3c 0%, #090d18 50%);
        color: #eef2ff;
        min-height: 100vh;
        padding: 28px;
        overflow-x: hidden;
      }
      body:before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: radial-gradient(#ffffff14 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: radial-gradient(ellipse at 60% 30%, #000 0%, transparent 70%);
        -webkit-mask-image: radial-gradient(ellipse at 60% 30%, #000 0%, transparent 70%);
        pointer-events: none;
      }
      .shell {
        position: relative;
        max-width: 1200px;
        margin: auto;
        background: #101827;
        border: 1px solid #29354b;
        border-radius: 24px;
        padding: 40px 36px 32px;
        box-shadow: 0 25px 70px #0006;
        overflow: hidden;
      }
      .shell:before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 3px;
        background: linear-gradient(90deg, #7547d5, #38b6f5, #20c8ad);
      }
      .hero {
        display: grid;
        grid-template-columns: 1.05fr 1fr;
        gap: 28px;
        align-items: center;
      }
      .pill {
        display: inline-block;
        background: #352350;
        color: #cbb2ff;
        border-radius: 999px;
        padding: 7px 14px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1px;
      }
      h1 {
        font-size: clamp(38px, 6.2vw, 72px);
        line-height: 1.02;
        margin: 22px 0 22px;
        letter-spacing: -2.5px;
        font-weight: 850;
        background: linear-gradient(100deg, #fff 20%, #cbb2ff 60%, #7be3d3);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .by {
        display: flex;
        align-items: center;
        gap: 14px;
        color: #8fa1ba;
        font-size: 18px;
      }
      .by strong {
        color: #fff;
      }
      .by svg {
        width: 44px;
        height: auto;
        filter: drop-shadow(0 0 14px #ffd81466);
      }
      .tag {
        color: #9bacc5;
        margin: 20px 0 26px;
        font-size: 16px;
        line-height: 1.55;
        max-width: 470px;
      }
      .go {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        background: #7547d5;
        border: 1px solid #7547d5;
        color: #fff;
        text-decoration: none;
        font-weight: 750;
        border-radius: 12px;
        padding: 13px 20px;
        transition:
          transform 0.2s,
          background 0.2s,
          box-shadow 0.2s;
      }
      .go:hover {
        background: #8d60ee;
        transform: translateY(-2px);
        box-shadow: 0 10px 30px #7547d566;
      }
      .panel {
        background: #141f30;
        border: 1px solid #2a3a52;
        border-radius: 20px;
        padding: 10px;
        position: relative;
      }
      .panel svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .edge {
        stroke: #2a3c56;
        stroke-width: 2;
      }
      .packet {
        fill: #ad90ff;
        filter: drop-shadow(0 0 6px #a78bfa);
      }
      .node circle.outer {
        fill: #22324b;
        stroke: #7187b0;
        stroke-width: 3;
      }
      .node circle.inner {
        fill: #7187b0;
      }
      .node.leader circle.outer {
        stroke: #20c8ad;
      }
      .node.leader circle.inner {
        fill: #20c8ad;
      }
      .node.cand circle.outer {
        stroke: #f0aa56;
      }
      .node.cand circle.inner {
        fill: #f0aa56;
      }
      .node text {
        font-weight: 800;
        text-anchor: middle;
        fill: #0c1624;
      }
      .pulse {
        fill: none;
        stroke: #20c8ad;
        stroke-width: 2;
        transform-box: fill-box;
        transform-origin: center;
      }
      .hub {
        fill: #0b1220;
        stroke: #2a3a52;
        stroke-width: 2;
      }
      h2 {
        font-size: 12px;
        letter-spacing: 1.6px;
        color: #8fa1ba;
        margin: 34px 0 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .card {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        background: #141f30;
        border: 1px solid #2a3a52;
        border-radius: 14px;
        padding: 14px 15px;
        color: inherit;
        text-decoration: none;
        transition:
          transform 0.2s,
          border-color 0.2s,
          background 0.2s;
        opacity: 0;
        animation: up 0.6s ease forwards;
      }
      .card:hover {
        transform: translateY(-3px);
        border-color: #7547d5;
        background: #2a2150;
      }
      .card i {
        flex: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #22324b;
        color: #cbb2ff;
        font:
          800 12px Inter,
          sans-serif;
        display: grid;
        place-items: center;
        font-style: normal;
      }
      .card b {
        display: block;
        font-size: 15px;
        color: #eef2ff;
      }
      .card span {
        display: block;
        font-size: 12.5px;
        color: #8fa1ba;
        margin-top: 3px;
        line-height: 1.4;
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .hero > * {
        animation: up 0.7s ease both;
      }
      .hero > .panel {
        animation-delay: 0.15s;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }
        .card {
          opacity: 1;
        }
      }
      @media (max-width: 900px) {
        .hero {
          grid-template-columns: 1fr;
        }
        .grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 560px) {
        body {
          padding: 10px;
        }
        .shell {
          padding: 28px 16px 20px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <script src="nav.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <span class="pill">TECHNICAL OVERVIEW</span>
          <h1>Raft &amp; How Vault uses it</h1>
          <div class="by">
            <svg viewBox="0 0 100 94" aria-label="Vault logo" role="img">
              <polygon
                points="8,10 92,10 50,86"
                fill="#ffd814"
                stroke="#ffd814"
                stroke-width="8"
                stroke-linejoin="round"
              />
              <g fill="#101827">
                <rect x="33" y="24" width="10" height="10" />
                <rect x="45" y="24" width="10" height="10" />
                <rect x="57" y="24" width="10" height="10" />
                <rect x="33" y="36" width="10" height="10" />
                <rect x="45" y="36" width="10" height="10" />
                <rect x="57" y="36" width="10" height="10" />
                <rect x="45" y="48" width="10" height="10" />
              </g>
            </svg>
            <span>Presented by <strong>Malcom Myers</strong></span>
          </div>
          <p class="tag">
            From leader election to replicated logs, and how HashiCorp Vault uses Raft to keep its
            encrypted storage consistent and available.
          </p>
          <a class="go" href="raft_dark_mode.html">Start the presentation →</a>
        </div>
        <div class="panel">
          <svg
            viewBox="0 0 500 420"
            aria-label="Animated five-node Raft cluster around the Vault logo"
          >
            <g id="edges"></g>
            <g id="packets"></g>
            <g id="nodes"></g>
            <circle class="hub" cx="250" cy="215" r="52" />
            <g transform="translate(250 215) scale(.62) translate(-50 -47)">
              <polygon
                points="8,10 92,10 50,86"
                fill="#ffd814"
                stroke="#ffd814"
                stroke-width="8"
                stroke-linejoin="round"
              />
              <g fill="#0b1220">
                <rect x="33" y="24" width="10" height="10" />
                <rect x="45" y="24" width="10" height="10" />
                <rect x="57" y="24" width="10" height="10" />
                <rect x="33" y="36" width="10" height="10" />
                <rect x="45" y="36" width="10" height="10" />
                <rect x="57" y="36" width="10" height="10" />
                <rect x="45" y="48" width="10" height="10" />
              </g>
            </g>
          </svg>
        </div>
      </section>
      <h2>WHAT WE'LL COVER</h2>
      <div class="grid" id="grid"></div>
    </main>
    <script>
      const topics = window.RAFT_PAGES.slice(1); // same list as the menu, so these cards always match the real slides
      document.getElementById("grid").innerHTML = topics
        .map(
          (t, i) =>
            `<a class="card" href="${t[0]}" style="animation-delay:${0.35 + i * 0.07}s"><i>${String(i + 2).padStart(2, "0")}</i><div><b>${t[1]}</b><span>${t[2]}</span></div></a>`,
        )
        .join("");
      const xy = [
          [250, 62],
          [428, 190],
          [360, 366],
          [140, 366],
          [72, 190],
        ],
        cx = 250,
        cy = 215,
        $ = (id) => document.getElementById(id);
      $("edges").innerHTML = xy
        .flatMap((a, i) =>
          xy
            .slice(i + 1)
            .map((b) => `<line class="edge" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`),
        )
        .join("");
      $("nodes").innerHTML = xy
        .map(
          ([x, y], i) =>
            `<g class="node ${i === 3 ? "leader" : ""}" transform="translate(${x},${y})">${i === 3 ? '<circle class="pulse" r="46" id="pulse"/>' : ""}<circle class="outer" r="40"/><circle class="inner" r="31"/><text y="-1" font-size="19">S${i + 1}</text><text y="14" font-size="8">${i === 3 ? "LEADER" : "FOLLOWER"}</text></g>`,
        )
        .join("");
      const still = matchMedia("(prefers-reduced-motion:reduce)").matches;
      function frame(t) {
        const c = t / 1000,
          pulse = $("pulse");
        if (pulse) {
          const k = (c % 2.2) / 2.2;
          pulse.setAttribute("transform", "scale(" + (1 + k * 0.55) + ")");
          pulse.style.opacity = (1 - k) * 0.8;
        }
        let h = "";
        [0, 1, 2, 4].forEach((to, n) => {
          const u = (c * 0.55 + n * 0.23) % 1,
            p = xy[3],
            q = xy[to];
          h += `<circle class="packet" cx="${p[0] + (q[0] - p[0]) * u}" cy="${p[1] + (q[1] - p[1]) * u}" r="6" opacity="${Math.sin(u * Math.PI)}"/>`;
        });
        // occasional acknowledgement back to leader
        [0, 1].forEach((from, n) => {
          const u = (c * 0.55 + n * 0.31 + 0.5) % 1,
            p = xy[from],
            q = xy[3];
          h += `<circle class="packet" fill="#2de2c4" cx="${p[0] + (q[0] - p[0]) * u}" cy="${p[1] + (q[1] - p[1]) * u}" r="5" opacity="${Math.sin(u * Math.PI) * 0.8}"/>`;
        });
        $("packets").innerHTML = h;
        if (!still) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
