<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raft in Practice — Vault CLI</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 25% 0%,#211a3c 0%,#090d18 50%);color:#eef2ff;min-height:100vh;padding:28px}.shell{max-width:1200px;margin:auto;background:#101827;border:1px solid #29354b;border-radius:24px;padding:28px;box-shadow:0 25px 70px #0006}.pill{display:inline-block;background:#352350;color:#cbb2ff;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;letter-spacing:1px}h1{font-size:clamp(26px,4vw,40px);margin:16px 0 6px;letter-spacing:-1px}.sub{color:#9bacc5;margin:0 0 22px}.layout{display:grid;grid-template-columns:1fr 1.15fr;gap:18px}.panel{background:#141f30;border:1px solid #2a3a52;border-radius:18px;padding:17px;min-width:0}.panel h2{font-size:12px;letter-spacing:1.6px;color:#8fa1ba;margin:0 0 12px}.cmd{display:block;width:100%;text-align:left;background:#1a293e;border:1px solid #41516a;color:#eef2ff;border-radius:12px;padding:13px 15px;margin-bottom:10px;cursor:pointer;font:inherit}.cmd:hover{background:#2b3b55}.cmd.active{border-color:#7547d5;background:#2a2150}.cmd b{display:block;font-size:11px;letter-spacing:1.2px;color:#c4a6ff;margin-bottom:4px}.cmd code{font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9cfff0}.cmd span{display:block;color:#9bacc5;font-size:13px;margin-top:6px;line-height:1.45}.term{background:#070b13;border:1px solid #2a3a52;border-radius:12px;overflow:hidden}.bar{display:flex;gap:6px;padding:9px 12px;background:#0d1522;border-bottom:1px solid #2a3a52}.bar i{width:10px;height:10px;border-radius:50%;background:#41516a}pre{margin:0;padding:16px;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfe3ff;white-space:pre;overflow-x:auto;min-height:250px}.p{color:#22d3b6}.ok{color:#20c8ad}.warn{color:#f0aa56}.dim{color:#7a8ca6}.caret{display:inline-block;width:8px;height:15px;background:#9cfff0;vertical-align:-2px;animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:0}}.note{color:#8496af;font-size:12px;margin-top:15px;line-height:1.5}.notes{margin-top:18px;background:#141f30;border:1px solid #2a3a52;border-radius:14px;padding:14px 17px;color:#bdc9da;font-size:13px;line-height:1.6}.notes strong{color:#c4a6ff}@media(max-width:820px){body{padding:10px}.shell{padding:16px}.layout{grid-template-columns:1fr}}
</style><script src="nav.js"></script></head><body><main class="shell"><span class="pill">RAFT IN PRACTICE</span><h1>Vault CLI: Observing a Real Cluster</h1><p class="sub">Vault provides CLI commands for inspecting its integrated Raft storage. Pick a command to see example output.</p><div class="layout"><section class="panel"><h2>COMMANDS</h2><button class="cmd active" data-i="0"><b>1 · OPERATIONAL STATUS</b><code>vault status</code><span>Shows whether Vault is initialized, sealed, and active or standby, along with Raft index information.</span></button><button class="cmd" data-i="1"><b>2 · CLUSTER MEMBERS</b><code>vault operator raft list-peers</code><span>Displays peer IDs, addresses, leader status, and voting eligibility.</span></button><button class="cmd" data-i="2"><b>3 · AUTOPILOT HEALTH</b><code>vault operator raft autopilot state</code><span>Reports cluster health, voter information, and server replication status.</span></button></section><section class="panel"><h2>EXAMPLE TERMINAL OUTPUT</h2><div class="term"><div class="bar"><i></i><i></i><i></i></div><pre id="out"></pre></div></section></div></main><script>
const cmds=['vault status','vault operator raft list-peers','vault operator raft autopilot state'];
const outs=[
`<span class="dim">Key                     Value
---                     -----</span>
Initialized             <span class="ok">true</span>
Sealed                  <span class="ok">false</span>
HA Enabled              true
HA Mode                 <span class="ok">active</span>
Storage Type            raft
Raft Committed Index    <span class="warn">1042</span>
Raft Applied Index      <span class="warn">1042</span>`,
`<span class="dim">Node           State       Voter
----           -----       -----</span>
vault-node-1   <span class="ok">leader</span>      true
vault-node-2   follower    true
vault-node-3   follower    true`,
`Healthy:                   <span class="ok">true</span>
Failure Tolerance:         1
Leader:                    vault-node-1
Voters:
   vault-node-1
   vault-node-2
   vault-node-3
Servers:
   <span class="dim">Node           Status   Healthy   Last Index</span>
   vault-node-1   <span class="ok">leader</span>   true      1042
   vault-node-2   <span class="ok">voter</span>    true      1042
   vault-node-3   <span class="ok">voter</span>    true      1041`];
let tm=null;const out=document.getElementById('out');
function show(i){clearTimeout(tm);document.querySelectorAll('.cmd').forEach((b,j)=>b.classList.toggle('active',i===j));const c=cmds[i];let n=0;out.innerHTML='<span class="p">$</span> <span class="typed"></span><span class="caret"></span>';const t=out.querySelector('.typed');
(function type(){if(n<=c.length){t.textContent=c.slice(0,n++);tm=setTimeout(type,28)}else{out.innerHTML='<span class="p">$</span> '+c+'\n\n'+outs[i]+'\n\n<span class="p">$</span> <span class="caret"></span>'}})()}
document.querySelectorAll('.cmd').forEach(b=>b.onclick=()=>show(+b.dataset.i));show(0);
</script></body></html>
